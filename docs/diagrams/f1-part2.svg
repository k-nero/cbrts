<text x="910" y="209.8" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#43246B" font-weight="normal" text-anchor="middle" dominant-baseline="central">From Part 1 — request</text>
<text x="910" y="231.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#43246B" font-weight="normal" text-anchor="middle" dominant-baseline="central">accepted for quotation</text>
<rect x="770" y="319.4" width="280" height="106" rx="8" ry="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>

<text x="910" y="340.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Build the quotation: legs,</text>
<text x="910" y="361.8" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">stalls, quarantine,</text>
<text x="910" y="383.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">documentation, escort,</text>
<text x="910" y="404.3" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">insurance, contingency</text>
<rect x="420" y="471.4" width="280" height="106" rx="8" ry="8" fill="#E8F1FB" stroke="#2E6DA4" stroke-width="1.6"/>
<text x="560" y="484.4" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2E6DA4" font-weight="bold" text-anchor="middle" dominant-baseline="central">STATUS → QUOTED</text>
<text x="560" y="520.3" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#123A5E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Issue the quote (valid 7 days)</text>
<text x="560" y="541.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#123A5E" font-weight="normal" text-anchor="middle" dominant-baseline="central">and notify the customer</text>
<polygon points="210,617.04 338.8,676.4 210,735.76 81.19999999999999,676.4" fill="#FFF6E0" stroke="#B9852A" stroke-width="1.6"/>
<text x="210" y="657.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5C4210" font-weight="normal" text-anchor="middle" dominant-baseline="central">Customer accepts</text>
<text x="210" y="676.4" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5C4210" font-weight="normal" text-anchor="middle" dominant-baseline="central">within the validity</text>
<text x="210" y="695.8" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5C4210" font-weight="normal" text-anchor="middle" dominant-baseline="central">period?</text>
<rect x="81.19999999999999" y="793.42" width="257.6" height="69.96000000000001" rx="34.980000000000004" ry="34.980000000000004" fill="#FBE7E4" stroke="#B23A2C" stroke-width="1.6"/>
<text x="210" y="806.4" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#B23A2C" font-weight="bold" text-anchor="middle" dominant-baseline="central">STATUS → EXPIRED / DECLINED</text>
<text x="210" y="813.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#79231A" font-weight="normal" text-anchor="middle" dominant-baseline="central">Request closed — the</text>
<text x="210" y="834.9" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#79231A" font-weight="normal" text-anchor="middle" dominant-baseline="central">customer may ask for a</text>
<text x="210" y="856.1" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#79231A" font-weight="normal" text-anchor="middle" dominant-baseline="central">re-quote</text>
<rect x="70" y="927.4" width="280" height="106" rx="8" ry="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>
<text x="210" y="940.4" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle" dominant-baseline="central">STATUS → CUSTOMER_ACCEPTED</text>
<text x="210" y="976.3" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Accept the quote and confirm</text>
<text x="210" y="997.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">the deposit</text>
<rect x="770" y="1079.4" width="280" height="106" rx="8" ry="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>
<text x="910" y="1092.4" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle" dominant-baseline="central">STATUS → APPROVED</text>
<text x="910" y="1128.3" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Final approval and sign-off —</text>
<text x="910" y="1149.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">pricing is locked</text>
<rect x="420" y="1231.4" width="280" height="106" rx="8" ry="8" fill="#E8F1FB" stroke="#2E6DA4" stroke-width="1.6"/>

<text x="560" y="1252.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#123A5E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Create Transport Job</text>
<text x="560" y="1273.8" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#123A5E" font-weight="normal" text-anchor="middle" dominant-baseline="central">CBRT-YYYY-NNN and assign</text>
<text x="560" y="1295.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#123A5E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Transport Specialist +</text>
<text x="560" y="1316.3" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#123A5E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Coordinator</text>
<rect x="420" y="1383.4" width="280" height="106" rx="8" ry="8" fill="#F3E9FA" stroke="#7A4BA8" stroke-width="1.6"/>

<text x="560" y="1404.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#43246B" font-weight="normal" text-anchor="middle" dominant-baseline="central">Generate the per-horse</text>
<text x="560" y="1425.8" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#43246B" font-weight="normal" text-anchor="middle" dominant-baseline="central">document checklist → Flow 2</text>
<text x="560" y="1447.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#43246B" font-weight="normal" text-anchor="middle" dominant-baseline="central">· Push the job to the planning</text>
<text x="560" y="1468.3" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#43246B" font-weight="normal" text-anchor="middle" dominant-baseline="central">backlog → Flow 3</text>
<rect x="81.19999999999999" y="1553.42" width="257.6" height="69.96000000000001" rx="34.980000000000004" ry="34.980000000000004" fill="#FBE7E4" stroke="#B23A2C" stroke-width="1.6"/>

<text x="210" y="1567.2" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#79231A" font-weight="normal" text-anchor="middle" dominant-baseline="central">Customer notified: request</text>
<text x="210" y="1588.4" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#79231A" font-weight="normal" text-anchor="middle" dominant-baseline="central">approved and job code</text>
