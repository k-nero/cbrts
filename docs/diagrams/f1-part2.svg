<rect width="1120" height="1711.4" fill="#FFFFFF"/>
<text x="560" y="32.0" font-family="Helvetica, Arial, sans-serif" font-size="27.55" fill="#1F3A5F" font-weight="bold" text-anchor="middle" dominant-baseline="central">Flow 1 — Transport Request Creation &amp; Approval (Part 2 of 2)</text><text x="560" y="69.2" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4A5A70" font-weight="normal" text-anchor="middle" dominant-baseline="central">From quotation to approval, job creation and hand-off into Flow 2 and Flow 3</text>
