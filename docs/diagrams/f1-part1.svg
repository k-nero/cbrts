<rect width="1120" height="1711.4" fill="#FFFFFF"/>
<text x="560" y="32.0" font-family="Helvetica, Arial, sans-serif" font-size="27.55" fill="#1F3A5F" font-weight="bold" text-anchor="middle" dominant-baseline="central">Flow 1 — Transport Request Creation &amp; Approval (Part 1 of 2)</text><text x="560" y="69.2" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4A5A70" font-weight="normal" text-anchor="middle" dominant-baseline="central">From customer submission to the Logistics Manager's feasibility decision</text>
<rect x="35" y="141.4" width="350" height="1528" fill="#FFFFFF" stroke="#C7D3E2" stroke-width="1"/><rect x="35" y="92" width="350" height="49.4" fill="#1F3A5F"/><text x="210" y="116.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="central">Customer (Club / Horse Owner)</text><rect x="385" y="141.4" width="350" height="1528" fill="#F4F7FB" stroke="#C7D3E2" stroke-width="1"/><rect x="385" y="92" width="350" height="49.4" fill="#1F3A5F"/><text x="560" y="116.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="central">System (CBRTS)</text><rect x="735" y="141.4" width="350" height="1528" fill="#FFFFFF" stroke="#C7D3E2" stroke-width="1"/><rect x="735" y="92" width="350" height="49.4" fill="#1F3A5F"/><text x="910" y="116.7" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="central">Logistics Manager</text>
<rect x="81.19999999999999" y="185.42000000000002" width="257.6" height="69.96000000000001" rx="34.980000000000004" ry="34.980000000000004" fill="#E3F3E8" stroke="#2E7D4F" stroke-width="1.6"/>

<text x="210" y="209.8" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1B4D31" font-weight="normal" text-anchor="middle" dominant-baseline="central">Customer needs transport</text>
<text x="210" y="231.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1B4D31" font-weight="normal" text-anchor="middle" dominant-baseline="central">for one or more racehorses</text>
<rect x="70" y="319.4" width="280" height="106" rx="8" ry="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>

<text x="210" y="340.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Create transport request:</text>
<text x="210" y="361.8" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">route, pickup / delivery</text>
<text x="210" y="383.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">window, horse list, special</text>
<text x="210" y="404.3" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">requirements</text>
<rect x="70" y="471.4" width="280" height="106" rx="8" ry="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>
<text x="210" y="484.4" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle" dominant-baseline="central">STATUS → SUBMITTED</text>
<text x="210" y="509.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Attach preliminary horse</text>
<text x="210" y="530.9" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">profiles and submit the</text>
<text x="210" y="552.1" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">request</text>
<rect x="420" y="623.4" width="280" height="106" rx="8" ry="8" fill="#E8F1FB" stroke="#2E6DA4" stroke-width="1.6"/>

<text x="560" y="655.1" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#123A5E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Validate mandatory data and</text>
<text x="560" y="676.4" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#123A5E" font-weight="normal" text-anchor="middle" dominant-baseline="central">check lead time against</text>
<text x="560" y="697.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#123A5E" font-weight="normal" text-anchor="middle" dominant-baseline="central">destination-country rules</text>
<polygon points="560,769.04 688.8,828.4 560,887.76 431.2,828.4" fill="#FFF6E0" stroke="#B9852A" stroke-width="1.6"/>
<text x="560" y="818.7" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5C4210" font-weight="normal" text-anchor="middle" dominant-baseline="central">Valid and lead time</text>
<text x="560" y="838.1" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5C4210" font-weight="normal" text-anchor="middle" dominant-baseline="central">satisfied?</text>
<rect x="420" y="927.4" width="280" height="106" rx="8" ry="8" fill="#E8F1FB" stroke="#2E6DA4" stroke-width="1.6"/>
<text x="560" y="940.4" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2E6DA4" font-weight="bold" text-anchor="middle" dominant-baseline="central">STATUS → UNDER_REVIEW</text>
<text x="560" y="965.6" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#123A5E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Place request in the</text>
<text x="560" y="986.9" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#123A5E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Logistics Manager queue and</text>
<text x="560" y="1008.1" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#123A5E" font-weight="normal" text-anchor="middle" dominant-baseline="central">notify</text>
<rect x="770" y="1079.4" width="280" height="106" rx="8" ry="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>

<text x="910" y="1111.2" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Review feasibility: route,</text>
<text x="910" y="1132.4" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">country pair, fleet capacity,</text>
<text x="910" y="1153.7" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">blackout dates</text>
<polygon points="910,1225.0400000000002 1038.8,1284.4 910,1343.76 781.2,1284.4" fill="#FFF6E0" stroke="#B9852A" stroke-width="1.6"/>
<text x="910" y="1284.4" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5C4210" font-weight="normal" text-anchor="middle" dominant-baseline="central">Review outcome?</text>
<rect x="770" y="1383.4" width="280" height="106" rx="8" ry="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/>
<text x="910" y="1396.4" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle" dominant-baseline="central">STATUS → INFO_REQUIRED</text>
<text x="910" y="1432.3" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">Send the request back for the</text>
<text x="910" y="1453.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#16202E" font-weight="normal" text-anchor="middle" dominant-baseline="central">missing information</text>
<rect x="420" y="1535.4" width="280" height="106" rx="8" ry="8" fill="#F3E9FA" stroke="#7A4BA8" stroke-width="1.6"/>

<text x="560" y="1567.2" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#43246B" font-weight="normal" text-anchor="middle" dominant-baseline="central">Continue to Part 2 —</text>
<text x="560" y="1588.4" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#43246B" font-weight="normal" text-anchor="middle" dominant-baseline="central">quotation, acceptance and job</text>
<text x="560" y="1609.7" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#43246B" font-weight="normal" text-anchor="middle" dominant-baseline="central">creation</text>
<rect x="781.2" y="1553.42" width="257.6" height="69.96000000000001" rx="34.980000000000004" ry="34.980000000000004" fill="#FBE7E4" stroke="#B23A2C" stroke-width="1.6"/>
<text x="910" y="1566.4" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#B23A2C" font-weight="bold" text-anchor="middle" dominant-baseline="central">STATUS → REJECTED</text>
<text x="910" y="1584.3" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#79231A" font-weight="normal" text-anchor="middle" dominant-baseline="central">Request closed with a</text>
<text x="910" y="1605.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#79231A" font-weight="normal" text-anchor="middle" dominant-baseline="central">documented reason</text>
