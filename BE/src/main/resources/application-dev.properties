# A developer machine: the app runs directly, Postgres and SeaweedFS run in compose on localhost.
# Every value here is for local development only.
spring.datasource.url=jdbc:postgresql://localhost:5432/cbrtsdb
spring.datasource.username=postgres
spring.datasource.password=123456
jwt.secret=local-dev-only-jwt-secret-change-me-in-any-real-env
# Password for the seeded demo accounts.
app.seed.default.password=changeme123!
# The compose "storage" service (SeaweedFS). Use app.storage.type=local to run without Docker.
app.storage.s3.endpoint=http://localhost:8333
app.storage.s3.access-key=cbrts
app.storage.s3.secret-key=local-dev-only-s3-secret
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.generate-ddl=true
debug=true
