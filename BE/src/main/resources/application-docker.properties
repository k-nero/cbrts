# The backend container in compose: other services by their compose names. Secrets come from the environment,
# never from this file: SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, JWT_SECRET,
# APP_SEED_DEFAULT_PASSWORD, APP_STORAGE_S3_ACCESSKEY, APP_STORAGE_S3_SECRETKEY, and for card payment
# APP_PAYMENT_STRIPE_SECRETKEY, APP_PAYMENT_STRIPE_WEBHOOKSECRET and APP_PAYMENT_RETURNURL.
spring.datasource.url=jdbc:postgresql://db:5432/cbrtsdb
app.storage.s3.endpoint=http://storage:8333
