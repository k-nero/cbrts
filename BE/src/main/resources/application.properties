spring.application.name=equifreight
# Settings every environment shares. Per-environment values (database, secrets, storage endpoint) live in
# application-{profile}.properties: dev for a developer machine, docker for compose. Any property can be
# overridden from the environment by its relaxed name, e.g. SPRING_DATASOURCE_URL, JWT_SECRET,
# APP_STORAGE_S3_SECRETKEY.
spring.profiles.default=dev
spring.datasource.driver-class-name=org.postgresql.Driver
# Schema is owned by Flyway (db/migration); Hibernate only validates the entities against it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.bootstrap=async
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# @Enumerated(STRING) columns are native PostgreSQL enum types (V1's create type ...), named after the Java enum.
spring.jpa.properties.hibernate.type.prefer_native_enum_types=true
spring.jpa.properties.hibernate.bytecode.use_reflection_optimizer=true
# JWT. jwt.secret (at least 32 bytes) comes from the profile or JWT_SECRET.
jwt.expirationMs=3600000
refreshToken.expirationSeconds=86400
# Uploads. Keep in step with client_max_body_size in FE/nginx.conf; the request limit leaves room for multipart overhead.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
# File storage. s3 = any S3-compatible service (compose, production); local = a directory on this machine, for
# running without Docker. Local files are relative to the working directory unless app.storage.local.dir is absolute.
app.storage.type=s3
app.storage.local.dir=data/files
# Leave app.storage.s3.endpoint empty to use AWS S3 itself; leave the keys empty to use the AWS default credential
# chain (e.g. an instance role).
app.storage.s3.region=us-east-1
app.storage.s3.bucket=cbrts-files
# SeaweedFS and most self-hosted servers need path-style URLs (endpoint/bucket/key).
app.storage.s3.path-style=true
