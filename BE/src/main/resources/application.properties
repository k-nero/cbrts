spring.application.name=equifreight
# Database. Override with env vars (DB_URL, DB_USERNAME, DB_PASSWORD) outside local dev.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cbrtsdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver
# Schema is owned by Flyway (db/migration); Hibernate only validates the entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# JWT. The default is for local dev only; set JWT_SECRET (at least 32 bytes) anywhere else.
jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-change-me-in-any-real-env}
jwt.expirationMs=3600000
refreshToken.expirationSeconds=86400
# Seed credentials for the one-account-per-role demo users (override in production)
app.seed.default.password=${SEED_PASSWORD:changeme123!}
# Uploads. Keep in step with client_max_body_size in FE/nginx.conf; the request limit leaves room for multipart overhead.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
# File storage. s3 = any S3-compatible service (compose, production); local = a directory on this machine, for
# running without Docker. Local files are relative to the working directory unless STORAGE_LOCAL_DIR is absolute.
app.storage.type=${STORAGE_TYPE:local}
app.storage.local.dir=${STORAGE_LOCAL_DIR:data/files}
# The S3 defaults match the compose "storage" service (SeaweedFS) on localhost, for local dev only. Leave
# S3_ENDPOINT empty to use AWS S3 itself; leave the keys empty to use the AWS default credential chain
# (e.g. an instance role).
app.storage.s3.endpoint=${S3_ENDPOINT:http://localhost:8333}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.bucket=${S3_BUCKET:cbrts-files}
app.storage.s3.access-key=${S3_ACCESS_KEY:cbrts}
app.storage.s3.secret-key=${S3_SECRET_KEY:local-dev-only-s3-secret}
# SeaweedFS and most self-hosted servers need path-style URLs (endpoint/bucket/key).
app.storage.s3.path-style=${S3_PATH_STYLE:true}
