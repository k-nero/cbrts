// The Flyway Gradle plugin runs on the build script's classpath, not the app's: since Flyway 10 it needs the
// PostgreSQL module here too, or every flyway* task fails with "No Flyway database plugin found".
buildscript {
    dependencies {
        classpath 'org.flywaydb:flyway-database-postgresql:13.10.3'
    }
}

plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    // processAot: generates bean-definition code at build time; used at runtime with -Dspring.aot.enabled=true
    id 'org.springframework.boot.aot' version '4.1.1'
    // Format check that runs the same from any IDE: ./gradlew spotlessApply, ./gradlew spotlessCheck
    id 'com.diffplug.spotless' version '8.10.4'
    id 'org.flywaydb.flyway' version '13.10.3'
}

group = 'com.equifreight'
version = '0.0.1-SNAPSHOT'
description = 'Cross-Border Racehorse Transport System (CBRTS) API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of((project.findProperty('javaVersion') ?: 25) as int)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Access tokens: Spring Security's JWT support (Nimbus JOSE + JWT), signed with the shared jwt.secret.
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-configuration-processor'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Uploaded files live in S3-compatible object storage (SeaweedFS in compose, S3 or R2 in production).
    // Only the sync client is used, so the Netty async transport is left out.
    implementation platform('software.amazon.awssdk:bom:2.56.0')
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    // File type detection from the bytes themselves (magic numbers), not the client's Content-Type.
    implementation 'org.apache.tika:tika-core:4.1.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation("org.junit.jupiter:junit-jupiter")
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Local schema tasks: ./gradlew flywayInfo, flywayMigrate, and flywayClean then flywayMigrate to reset a dev database.
// Same connection as the app's dev profile, overridden the same way: SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD.
def devProfile = new Properties()
file('src/main/resources/application-dev.properties').withInputStream { devProfile.load(it) }
flyway {
    url = System.getenv('SPRING_DATASOURCE_URL') ?: devProfile['spring.datasource.url']
    user = System.getenv('SPRING_DATASOURCE_USERNAME') ?: devProfile['spring.datasource.username']
    password = System.getenv('SPRING_DATASOURCE_PASSWORD') ?: devProfile['spring.datasource.password']
    schemas = ['public']
    locations = ['filesystem:src/main/resources/db/migration']
    // Flyway 10+ refuses clean by default. These tasks only ever point at a developer's own database.
    cleanDisabled = false
}

spotless {
    // Only files changed since origin/main are checked and formatted, so #108's reformat isn't repeated repo-wide.
    ratchetFrom 'origin/main'
    // ./gradlew check (and build) runs spotlessCheck.
    enforceCheck = true

    // Java sources only. Never format src/main/resources/db/migration: Flyway checksums merged migrations,
    // so even a whitespace change fails validation on databases that already ran them.
    java {
        target 'src/**/*.java'
        // Palantir style: 4-space indent, 120 columns, close to IntelliJ's default Java style.
        palantirJavaFormat('2.102.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
