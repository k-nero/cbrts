server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 25 MB files plus multipart overhead; matches spring.servlet.multipart.max-request-size.
    client_max_body_size 26m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS, so nginx re-resolves "backend" when that container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI through the same origin.
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rsbuild emits content-hashed file names under /static.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always; 
        try_files $uri $uri/ /index.html;
    }
}
