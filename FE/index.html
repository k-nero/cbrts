<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>EquiFreight</title>
        <script>
            // Pick the theme before first paint so the page never flashes the wrong mode. Light is the
            // presented theme; Dark only when picked. stores/themeStore.ts owns it from here; keep
            // the key ('ef.theme') in step.
            (function () {
                let mode;
                try {
                    mode = localStorage.getItem('ef.theme');
                } catch (e) {}
                if (mode !== 'dark') mode = 'light';
                document.documentElement.dataset.theme = mode;
                document.documentElement.style.colorScheme = mode;
            })();
        </script>
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Outfit:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
