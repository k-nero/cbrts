[[configurations]]
id = "gradle:bootRun:BE"
name = "BE: gradle bootRun"
kind = "gradle"
command = "./gradlew"
args = ["bootRun"]
cwd = "BE"
debug-adapter = "java-debug"
params = { activeProfiles = "dev", arguments = "", executable = "./gradlew", projectDir = "BE", tasks = "bootRun", wrapper = "true" }

[[configurations]]
id = "application:BE:com.equifreight.EquiFreightApplication"
name = "EquiFreightApplication"
kind = "spring-boot"
command = "java"
args = ["-cp", "${classpath}", "com.equifreight.EquiFreightApplication", "--spring.profiles.active=dev"]
module = "BE"
cwd = "BE"
debug-adapter = "java-debug"
params = { activeProfiles = "dev", classpath = "${classpath}", mainClass = "com.equifreight.EquiFreightApplication", programArgs = "", vmOptions = "" }

[[configurations]]
id = "docker:compose:docker-compose.yml:db"
name = "docker-compose.yml: db"
kind = "docker-compose"
command = "docker compose -f docker-compose.yml up -d db"
params = { connection = "default", detach = "true", files = "docker-compose.yml", services = "db" }

[[configurations]]
id = "docker:compose:docker-compose.yml:storage"
name = "docker-compose.yml: storage"
kind = "docker-compose"
command = "docker compose -f docker-compose.yml up -d storage"
params = { connection = "default", detach = "true", files = "docker-compose.yml", services = "storage" }
