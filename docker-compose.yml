name: equifreight

services:
  db:
    image: postgres:19beta4-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: cbrtsdb
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for uploaded files. "mini" runs SeaweedFS as a single process and
  # creates the bucket on startup; the AWS_* variables become its only (admin) credentials, so
  # anonymous requests are refused.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: mini -dir=/data -bucket=${S3_BUCKET:-cbrts-files} -admin.ui=false -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-cbrts}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - storage-data:/data
    ports:
      - "${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    # JVM image with Spring AOT and a JDK AOT cache (see BE/Dockerfile)
    build: ./BE
    image: equifreight-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/cbrtsdb
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ bytes) in .env}
      SEED_PASSWORD: ${SEED_PASSWORD:-changeme123!}
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: ${S3_BUCKET:-cbrts-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cbrts}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  frontend:
    build: ./FE
    image: equifreight-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  db-data:
  storage-data:
