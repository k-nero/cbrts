name: equifreight

services:
  db:
    image: postgres:19beta4-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: cbrtsdb
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for uploaded files. "mini" runs SeaweedFS as a single process and
  # creates the bucket on startup; the AWS_* variables become its only (admin) credentials, so
  # anonymous requests are refused.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: mini -dir=/data -bucket=${APP_STORAGE_S3_BUCKET:-cbrts-files} -admin.ui=false -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${APP_STORAGE_S3_ACCESSKEY:-cbrts}
      AWS_SECRET_ACCESS_KEY: ${APP_STORAGE_S3_SECRETKEY:?set APP_STORAGE_S3_SECRETKEY in .env}
    volumes:
      - storage-data:/data
    ports:
      - "${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    # JVM image with Spring AOT and a JDK AOT cache (see BE/Dockerfile)
    build: ./BE
    image: equifreight-api
    restart: unless-stopped
    # Hostnames come from application-docker.properties; secrets are Spring's relaxed property names.
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ bytes) in .env}
      APP_SEED_DEFAULT_PASSWORD: ${APP_SEED_DEFAULT_PASSWORD:-changeme123!}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-cbrts-files}
      APP_STORAGE_S3_ACCESSKEY: ${APP_STORAGE_S3_ACCESSKEY:-cbrts}
      APP_STORAGE_S3_SECRETKEY: ${APP_STORAGE_S3_SECRETKEY}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  frontend:
    build: ./FE
    image: equifreight-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  db-data:
  storage-data:
